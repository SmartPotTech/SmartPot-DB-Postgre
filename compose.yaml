name: smartpot-db-postgre

services:
  db-smartpot:
    build: .
    image: ghcr.io/smartpottech/smartpot-db-postgre:latest
    container_name: smartpot-db-postgre
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    # Solo los caps que el entrypoint de PostgreSQL necesita para preparar su directorio de datos y bajar al
    # usuario postgres; los caps de escalado (NET_ADMIN, SYS_ADMIN, etc.) siguen descartados.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql

volumes:
  db_data:
